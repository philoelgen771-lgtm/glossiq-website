<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Order Manager - GLOSSIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
--bg:#07090c;
--panel:#10141a;
--panel-border:#1f2733;
--blue:#2f8fff;
--blue2:#00c2ff;
--text:#f3f6fa;
--muted:#8b97a7;
--new:#5b8def;
--confirmed:#00c2ff;
--in_progress:#f5a623;
--completed:#2ecc71;
--cancelled:#ef4444;
}
*{box-sizing:border-box;}
body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;
min-height:100vh;
}
a{color:inherit;}
#loginScreen{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
}
.login-card{
width:100%;
max-width:380px;
background:var(--panel);
border:1px solid var(--panel-border);
border-radius:16px;
padding:36px 32px;
}
.logo{
font-weight:800;
font-size:22px;
letter-spacing:1px;
background:linear-gradient(90deg,var(--blue),var(--blue2));
-webkit-background-clip:text;
background-clip:text;
color:transparent;
text-align:center;
margin-bottom:4px;
}
.logo-sub{
text-align:center;
color:var(--muted);
font-size:12px;
letter-spacing:2px;
text-transform:uppercase;
margin-bottom:28px;
}
label{
display:block;
font-size:13px;
font-weight:600;
color:var(--muted);
margin-bottom:6px;
}
input[type=email], input[type=password], input[type=text], select{
width:100%;
background:#0b0f14;
border:1px solid var(--panel-border);
border-radius:10px;
padding:12px 14px;
color:var(--text);
font-size:14px;
font-family:inherit;
margin-bottom:18px;
outline:none;
transition:border-color .15s;
}
input:focus, select:focus{border-color:var(--blue);}
.btn{
width:100%;
border:none;
border-radius:10px;
padding:13px 16px;
font-size:14px;
font-weight:700;
font-family:inherit;
cursor:pointer;
transition:opacity .15s, transform .1s;
}
.btn:active{transform:scale(.98);}
.btn-primary{
background:linear-gradient(90deg,var(--blue),var(--blue2));
color:#03131f;
}
.btn-primary:hover{opacity:.92;}
.btn-ghost{
background:transparent;
border:1px solid var(--panel-border);
color:var(--text);
}
.btn-ghost:hover{border-color:var(--blue);}
#loginError{
color:var(--cancelled);
font-size:13px;
margin:-8px 0 16px;
display:none;
}
#dashboard{display:none;}
header.topbar{
position:sticky; top:0; z-index:10;
display:flex; align-items:center; justify-content:space-between;
padding:16px 28px;
background:rgba(7,9,12,.9);
backdrop-filter:blur(8px);
border-bottom:1px solid var(--panel-border);
flex-wrap:wrap;
gap:12px;
}
.topbar-left{display:flex; align-items:center; gap:14px;}
.topbar-title{font-weight:700; font-size:16px;}
.topbar-right{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted);}
.btn-sm{
padding:8px 14px; font-size:13px; border-radius:8px; width:auto;
}
main{padding:24px 28px 60px; max-width:1200px; margin:0 auto;}
.stats{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
gap:14px;
margin-bottom:24px;
}
.stat-card{
background:var(--panel);
border:1px solid var(--panel-border);
border-radius:14px;
padding:16px 18px;
}
.stat-value{font-size:24px; font-weight:800;}
.stat-label{font-size:12px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.5px;}
.stat-card.revenue .stat-value{
background:linear-gradient(90deg,var(--blue),var(--blue2));
-webkit-background-clip:text; background-clip:text; color:transparent;
}
.toolbar{
display:flex; gap:12px; flex-wrap:wrap; align-items:center;
margin-bottom:18px;
}
.toolbar input[type=text]{margin-bottom:0; flex:1; min-width:200px;}
.toolbar select{margin-bottom:0; width:auto; min-width:170px;}
.refresh-note{font-size:12px; color:var(--muted); margin-left:auto; white-space:nowrap;}
.order-card{
background:var(--panel);
border:1px solid var(--panel-border);
border-radius:14px;
padding:18px 20px;
margin-bottom:14px;
}
.order-top{
display:flex; justify-content:space-between; align-items:flex-start;
gap:12px; flex-wrap:wrap; margin-bottom:10px;
}
.order-ref{font-size:12px; color:var(--muted); letter-spacing:.5px;}
.order-name{font-size:17px; font-weight:700; margin-top:2px;}
.status-badge{
display:inline-block; padding:4px 12px; border-radius:20px;
font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
white-space:nowrap;
}
.badge-new{background:rgba(91,141,239,.15); color:var(--new);}
.badge-confirmed{background:rgba(0,194,255,.15); color:var(--confirmed);}
.badge-in_progress{background:rgba(245,166,35,.15); color:var(--in_progress);}
.badge-completed{background:rgba(46,204,113,.15); color:var(--completed);}
.badge-cancelled{background:rgba(239,68,68,.15); color:var(--cancelled);}
.order-grid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
gap:10px 20px;
font-size:13.5px;
margin-bottom:12px;
}
.order-grid .field-label{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:2px;}
.items-line{font-size:13px; color:var(--muted); margin-bottom:10px;}
.notes-line{
font-size:13px; color:var(--muted); background:#0b0f14; border:1px solid var(--panel-border);
border-radius:8px; padding:8px 10px; margin-bottom:12px;
}
.order-bottom{
display:flex; justify-content:space-between; align-items:center;
gap:12px; flex-wrap:wrap; border-top:1px solid var(--panel-border); padding-top:12px;
}
.order-total{font-size:16px; font-weight:800;}
.order-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.status-select{margin-bottom:0; width:auto; padding:8px 12px; font-size:13px;}
.wa-btn{
background:#128c7e; color:#fff; text-decoration:none;
padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600;
display:inline-flex; align-items:center; gap:6px;
}
.wa-btn:hover{opacity:.9;}
.empty-state{
text-align:center; padding:60px 20px; color:var(--muted);
}
.loading{text-align:center; padding:60px 20px; color:var(--muted); font-size:14px;}
.unauthorized{
max-width:420px; margin:80px auto; text-align:center; padding:32px;
background:var(--panel); border:1px solid var(--panel-border); border-radius:14px;
}
.unauthorized h2{color:var(--cancelled); margin-top:0;}
@media (max-width:560px){
main{padding:18px 14px 50px;}
header.topbar{padding:14px 16px;}
}
</style>
</head>
<body>
<div id="loginScreen">
<div class="login-card">
<div class="logo">GLOSSIQ</div>
<div class="logo-sub">Order Manager</div>
<form id="loginForm">
<label for="loginEmail">Email</label>
<input type="email" id="loginEmail" autocomplete="username" required>
<label for="loginPassword">Password</label>
<input type="password" id="loginPassword" autocomplete="current-password" required>
<div id="loginError"></div>
<button type="submit" class="btn btn-primary" id="loginBtn">Log In</button>
</form>
</div>
</div>
<div id="dashboard">
<header class="topbar">
<div class="topbar-left">
<div class="logo" style="font-size:18px;">GLOSSIQ</div>
<div class="topbar-title">Order Manager</div>
</div>
<div class="topbar-right">
<span id="whoami"></span>
<button class="btn btn-ghost btn-sm" id="refreshBtn">Refresh</button>
<button class="btn btn-ghost btn-sm" id="logoutBtn">Log Out</button>
</div>
</header>
<main>
<div class="stats" id="statsRow"></div>
<div class="toolbar">
<select id="statusFilter">
<option value="all">All statuses</option>
<option value="new">New</option>
<option value="confirmed">Confirmed</option>
<option value="in_progress">In Progress</option>
<option value="completed">Completed</option>
<option value="cancelled">Cancelled</option>
</select>
<input type="text" id="searchInput" placeholder="Search by name, phone, or reference">
<span class="refresh-note" id="refreshNote">Auto-refreshes every 30s</span>
</div>
<div id="ordersContainer">
<div class="loading">Loading orders</div>
</div>
</main>
</div>
<script>
const SUPABASE_URL = 'https://nbepzekgqlwwcicnwdos.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5iZXB6ZWtncWx3d2NpY253ZG9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODQyMTUsImV4cCI6MjEwMTg2MDIxNX0.anf_GkKjsoy37WUq1M-V5FcmLDGnJgxKGqd8n7sF394';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let allOrders = [];
let refreshTimer = null;
const loginScreen = document.getElementById('loginScreen');
const dashboard = document.getElementById('dashboard');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const loginBtn = document.getElementById('loginBtn');
const whoami = document.getElementById('whoami');
const ordersContainer = document.getElementById('ordersContainer');
const statsRow = document.getElementById('statsRow');
const statusFilter = document.getElementById('statusFilter');
const searchInput = document.getElementById('searchInput');
function showError(msg){
loginError.textContent = msg;
loginError.style.display = 'block';
}
async function checkAdminAndEnter(session){
const uid = session.user.id;
const resp = await sb.from('glossiq_admins').select('user_id').eq('user_id', uid);
const adminRows = resp.data;
const error = resp.error;
if (error || !adminRows || adminRows.length === 0){
dashboard.innerHTML = '<div class="unauthorized"><h2>Not authorized</h2><p>This account (' + session.user.email + ') is signed in but is not listed as a GLOSSIQ admin, so order data is hidden by the database security rules.</p><button class="btn btn-ghost" onclick="location.reload()">Back to login</button></div>';
loginScreen.style.display = 'none';
dashboard.style.display = 'block';
await sb.auth.signOut();
return;
}
whoami.textContent = session.user.email;
loginScreen.style.display = 'none';
dashboard.style.display = 'block';
loadOrders();
if (refreshTimer) clearInterval(refreshTimer);
refreshTimer = setInterval(loadOrders, 30000);
}
loginForm.addEventListener('submit', async function(e){
e.preventDefault();
loginError.style.display = 'none';
loginBtn.disabled = true;
loginBtn.textContent = 'Logging in';
const email = document.getElementById('loginEmail').value.trim();
const password = document.getElementById('loginPassword').value;
const resp = await sb.auth.signInWithPassword({ email: email, password: password });
loginBtn.disabled = false;
loginBtn.textContent = 'Log In';
if (resp.error){
showError(resp.error.message === 'Invalid login credentials' ? 'Incorrect email or password.' : resp.error.message);
return;
}
await checkAdminAndEnter(resp.data.session);
});
document.getElementById('logoutBtn').addEventListener('click', async function(){
if (refreshTimer) clearInterval(refreshTimer);
await sb.auth.signOut();
location.reload();
});
document.getElementById('refreshBtn').addEventListener('click', loadOrders);
statusFilter.addEventListener('change', render);
searchInput.addEventListener('input', render);
async function loadOrders(){
const resp = await sb.from('glossiq_orders').select('*').order('created_at', { ascending: false });
if (resp.error){
ordersContainer.innerHTML = '<div class="empty-state">Could not load orders: ' + resp.error.message + '</div>';
return;
}
allOrders = resp.data || [];
render();
}
function fmtEGP(n){
return 'EGP ' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
}
function fmtDate(d){
if (!d) return '-';
const dt = new Date(d + 'T00:00:00');
return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtCreated(ts){
const dt = new Date(ts);
return dt.toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}
function waLink(phone, name, ref){
let digits = (phone || '').replace(/[^0-9]/g, '');
if (digits.charAt(0) === '0') digits = '20' + digits.slice(1);
else if (digits.slice(0,2) !== '20') digits = '20' + digits;
const text = encodeURIComponent('Hi ' + (name || '') + ', this is GLOSSIQ regarding your booking ' + (ref || '') + '.');
return 'https://wa.me/' + digits + '?text=' + text;
}
function esc(s){
const d = document.createElement('div');
d.textContent = s == null ? '' : String(s);
return d.innerHTML;
}
function render(){
const statusVal = statusFilter.value;
const q = searchInput.value.trim().toLowerCase();
const total = allOrders.length;
const counts = { new:0, confirmed:0, in_progress:0, completed:0, cancelled:0 };
let completedRevenue = 0;
allOrders.forEach(function(o){
if (counts[o.status] !== undefined) counts[o.status]++;
if (o.status === 'completed') completedRevenue += Number(o.total || 0);
});
statsRow.innerHTML =
'<div class="stat-card"><div class="stat-value">' + total + '</div><div class="stat-label">Total Orders</div></div>' +
'<div class="stat-card"><div class="stat-value">' + counts.new + '</div><div class="stat-label">New</div></div>' +
'<div class="stat-card"><div class="stat-value">' + counts.confirmed + '</div><div class="stat-label">Confirmed</div></div>' +
'<div class="stat-card"><div class="stat-value">' + counts.in_progress + '</div><div class="stat-label">In Progress</div></div>' +
'<div class="stat-card"><div class="stat-value">' + counts.completed + '</div><div class="stat-label">Completed</div></div>' +
'<div class="stat-card revenue"><div class="stat-value">' + fmtEGP(completedRevenue) + '</div><div class="stat-label">Completed Revenue</div></div>';
let list = allOrders;
if (statusVal !== 'all') list = list.filter(function(o){ return o.status === statusVal; });
if (q){
list = list.filter(function(o){
return (o.customer_name || '').toLowerCase().indexOf(q) !== -1 ||
(o.phone || '').toLowerCase().indexOf(q) !== -1 ||
(o.ref || '').toLowerCase().indexOf(q) !== -1;
});
}
if (list.length === 0){
ordersContainer.innerHTML = '<div class="empty-state">No orders match this view yet.</div>';
return;
}
ordersContainer.innerHTML = list.map(function(o){
const items = Array.isArray(o.items) ? o.items : [];
const itemsText = items.map(function(it){ return esc(it.name) + ' (' + fmtEGP(it.price) + ')'; }).join(', ') || '-';
const vehicle = (o.vehicle_type || '-').replace('_', ' / ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
return '<div class="order-card" data-id="' + o.id + '">' +
'<div class="order-top"><div>' +
'<div class="order-ref">' + esc(o.ref) + ' - placed ' + fmtCreated(o.created_at) + '</div>' +
'<div class="order-name">' + esc(o.customer_name) + '</div>' +
'</div><span class="status-badge badge-' + o.status + '">' + (o.status || '').replace('_',' ') + '</span></div>' +
'<div class="order-grid">' +
'<div><div class="field-label">Phone</div>' + esc(o.phone) + '</div>' +
'<div><div class="field-label">Email</div>' + (esc(o.email) || '-') + '</div>' +
'<div><div class="field-label">Vehicle</div>' + esc(vehicle) + '</div>' +
'<div><div class="field-label">Date and Time</div>' + fmtDate(o.service_date) + ' - ' + esc(o.service_time) + '</div>' +
'<div style="grid-column:1/-1;"><div class="field-label">Address</div>' + esc(o.address) + '</div>' +
'</div>' +
'<div class="items-line"><strong style="color:var(--text);">Items:</strong> ' + itemsText + '</div>' +
(o.notes ? '<div class="notes-line">Notes: ' + esc(o.notes) + '</div>' : '') +
'<div class="order-bottom">' +
'<div class="order-total">' + fmtEGP(o.total) + '</div>' +
'<div class="order-actions">' +
'<select class="status-select" onchange="updateStatus(' + o.id + ', this.value)">' +
'<option value="new"' + (o.status==='new'?' selected':'') + '>New</option>' +
'<option value="confirmed"' + (o.status==='confirmed'?' selected':'') + '>Confirmed</option>' +
'<option value="in_progress"' + (o.status==='in_progress'?' selected':'') + '>In Progress</option>' +
'<option value="completed"' + (o.status==='completed'?' selected':'') + '>Completed</option>' +
'<option value="cancelled"' + (o.status==='cancelled'?' selected':'') + '>Cancelled</option>' +
'</select>' +
'<a class="wa-btn" href="' + waLink(o.phone, o.customer_name, o.ref) + '" target="_blank" rel="noopener">WhatsApp Customer</a>' +
'</div></div></div>';
}).join('');
}
async function updateStatus(id, newStatus){
const resp = await sb.from('glossiq_orders').update({ status: newStatus }).eq('id', id);
if (resp.error){
alert('Could not update status: ' + resp.error.message);
return;
}
const o = allOrders.find(function(x){ return x.id === id; });
if (o) o.status = newStatus;
render();
}
window.updateStatus = updateStatus;
(async function init(){
const resp = await sb.auth.getSession();
if (resp.data.session){
await checkAdminAndEnter(resp.data.session);
}
})();
</script>
</body>
</html>
